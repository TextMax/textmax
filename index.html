
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TextMax</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f0f2f5;
  color: #222;
}
header {
  background: #0866ff;
  color: white;
  padding: 18px 24px;
  font-size: 25px;
  font-weight: bold;
}
.app {
  display: flex;
  max-width: 1100px;
  height: 80vh;
  min-height: 450px;
  margin: 25px auto;
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 3px 15px #0001;
}
.sidebar {
  width: 300px;
  border-right: 1px solid #eee;
}
.sidebar h2 { padding: 15px; }
.friend {
  padding: 17px;
  cursor: pointer;
  border-top: 1px solid #eee;
}
.friend:hover { background: #f0f5ff; }
.chat {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.chat-title {
  padding: 20px;
  border-bottom: 1px solid #eee;
  font-weight: bold;
}
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.message {
  background: #eee;
  padding: 12px 16px;
  border-radius: 18px;
  max-width: 75%;
  align-self: flex-start;
  overflow-wrap: anywhere;
}
.message.mine {
  background: #0866ff;
  color: white;
  align-self: flex-end;
}
.input-area {
  display: flex;
  padding: 15px;
  gap: 10px;
  border-top: 1px solid #eee;
}
input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 25px;
  font-size: 15px;
}
button {
  background: #0866ff;
  color: white;
  border: none;
  border-radius: 25px;
  padding: 12px 20px;
  cursor: pointer;
}
@media(max-width:600px) {
  .app { margin: 0; height: calc(100vh - 60px); border-radius: 0; }
  .sidebar { width: 115px; }
  .friend { padding: 12px 7px; font-size: 13px; }
  .sidebar h2 { font-size: 17px; padding: 10px; }
  .input-area { padding: 9px; }
  button { padding: 10px 13px; }
}
</style>
</head>
<body>

<header>💬 TextMax</header>

<div class="app">
  <aside class="sidebar">
    <h2>Chats</h2>
    <div class="friend" onclick="openChat('Jake')">
      👦 Jake
    </div>
    <div class="friend" onclick="openChat('The Boys')">
      👥 The Boys
    </div>
    <div class="friend" onclick="openChat('Tom')">
      👦 Tom
    </div>
  </aside>

  <main class="chat">
    <div class="chat-title" id="chatTitle">
      Welcome to TextMax!
    </div>

    <div class="messages" id="messages">
      <div class="message">
        Welcome! Select a chat to get started.
      </div>
    </div>

    <div class="input-area">
      <input id="messageInput"
        placeholder="Type a message..."
        onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">Send</button>
    </div>
  </main>
</div>

<script>
let currentChat = "";

function openChat(name) {
  currentChat = name;
  document.getElementById("chatTitle").textContent = name;
  document.getElementById("messages").innerHTML = "";

  const saved = JSON.parse(
    localStorage.getItem("textmax_" + name) || "[]"
  );

  saved.forEach(msg => addMessage(msg.text, msg.mine));
}

function addMessage(text, mine) {
  const message = document.createElement("div");
  message.className = mine ? "message mine" : "message";
  message.textContent = text;
  document.getElementById("messages").appendChild(message);
  document.getElementById("messages").scrollTop =
    document.getElementById("messages").scrollHeight;
}

function sendMessage() {
  const input = document.getElementById("messageInput");
  const text = input.value.trim();

  if (!text || !currentChat) return;

  const saved = JSON.parse(
    localStorage.getItem("textmax_" + currentChat) || "[]"
  );

  saved.push({ text: text, mine: true });

  localStorage.setItem(
    "textmax_" + currentChat,
    JSON.stringify(saved)
  );

  addMessage(text, true);
  input.value = "";
}
</script>

</body>
</html>
